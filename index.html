<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace-panel" aria-label="Calculator workspace">
        <header class="hero-bar">
          <div>
            <p class="eyebrow">Backend calculator</p>
            <h1>Expression Workbench</h1>
            <p class="hero-copy">Backend calculation with saved history.</p>
          </div>
          <div class="status-stack">
            <button class="icon-button" id="themeToggle" type="button" title="Toggle theme" aria-label="Toggle theme">
              ◐
            </button>
            <span id="backendStatus" class="backend-status">Checking API</span>
          </div>
        </header>

        <section class="display-panel" aria-label="Display">
          <label class="input-label" for="expressionInput">Expression</label>
          <input id="expressionInput" class="expression-input" type="text" inputmode="decimal" autocomplete="off" placeholder="(1 + 2) * 3">
          <div class="result-row">
            <span class="result-label">Result</span>
            <output id="resultOutput" class="result-output">Waiting for input</output>
          </div>
          <p id="messageOutput" class="message-output" role="status"></p>
        </section>

        <section class="keypad" aria-label="Calculator keypad">
          <button type="button" data-action="clear">C</button>
          <button type="button" data-action="backspace">⌫</button>
          <button type="button" data-value="(">(</button>
          <button type="button" data-value=")">)</button>
          <button type="button" data-value="7">7</button>
          <button type="button" data-value="8">8</button>
          <button type="button" data-value="9">9</button>
          <button type="button" class="operator" data-value="/">÷</button>
          <button type="button" data-value="4">4</button>
          <button type="button" data-value="5">5</button>
          <button type="button" data-value="6">6</button>
          <button type="button" class="operator" data-value="*">×</button>
          <button type="button" data-value="1">1</button>
          <button type="button" data-value="2">2</button>
          <button type="button" data-value="3">3</button>
          <button type="button" class="operator" data-value="-">−</button>
          <button type="button" data-value="0">0</button>
          <button type="button" data-value=".">.</button>
          <button type="button" class="primary" data-action="calculate">=</button>
          <button type="button" class="operator" data-value="+">+</button>
        </section>
      </section>

      <section class="history-panel" aria-label="Calculation history">
        <header class="history-header">
          <div>
            <p class="eyebrow">Saved on backend</p>
            <h2>History</h2>
          </div>
          <button class="text-button" id="clearHistoryButton" type="button">Clear All</button>
        </header>
        <ol id="historyList" class="history-list"></ol>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
